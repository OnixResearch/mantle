[package]
name = "crunch-test"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "mantle-test-worker"
path = "src/main.rs"

[dependencies]
crunch-test-core = { path = "../crunch-test-core" }
crunch-test-app = { path = "../crunch-test-app" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
blake3 = "=1.8.5"
libc = "0.2"

[dev-dependencies]
tempfile = "3"
