[package]
name = "crunch-cc-driver"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
base64 = "0.22"
blake3 = "=1.8.2"
crunch-rust-cache-core = { path = "../crunch-rust-cache-core" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tempfile = "3"

[dev-dependencies]
crunch-rust-cache = { path = "../crunch-rust-cache" }
snix-castore = { path = "../../vendor/snix-castore" }
tokio = { version = "1", features = ["rt", "time"] }

[[bin]]
name = "mantle-cc-cache-driver"
path = "src/bin/mantle-cc-cache-driver.rs"
