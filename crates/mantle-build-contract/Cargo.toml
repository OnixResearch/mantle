[package]
name = "mantle-build-contract"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false
description = "Versioned no-std build request and observation contract for Mantle consumers"

[dependencies]
# Caret range so downstream consumers can unify with blake3 >= 1.8.5; the
# workspace Cargo.lock still pins 1.8.2 for the owner's own builds.
blake3 = { version = "1.8.2", default-features = false, features = ["pure"] }
serde = { version = "1.0", default-features = false, features = ["alloc", "derive"] }

[dev-dependencies]
serde_json = "1.0"

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
dbg_macro = "deny"
expect_used = "deny"
indexing_slicing = "deny"
panic = "deny"
todo = "deny"
unimplemented = "deny"
unwrap_used = "deny"
