[package]
name = "mantle-rust-differential"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
mantle-rust-differential-core = { path = "../mantle-rust-differential-core" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
blake3 = "=1.8.5"
libc = "0.2"

[[bin]]
name = "mantle-rust-differential"
path = "src/main.rs"

[[bin]]
name = "mantle-rust-wait-wrapper"
path = "src/bin/wait-wrapper.rs"
