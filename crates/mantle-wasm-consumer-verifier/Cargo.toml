[package]
name = "mantle-wasm-consumer-verifier"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Published consumer contract for verifying Mantle WebAssembly component materialization bundles"

[features]
default = ["std"]
std = ["blake3/std", "dep:bounded-tree-cap", "dep:bounded-tree-core", "dep:cap-std", "dep:cap-fs-ext"]

[dependencies]
blake3 = { version = "=1.8.5", default-features = false }
bounded-tree-cap = { git = "https://seed.radicle.garden/zqhtZvsteJhxCJE96dMAZSZ9y1PX.git", rev = "250f3b25d0933c2fa106aa82d1cc17a496716f06", optional = true }
bounded-tree-core = { git = "https://seed.radicle.garden/zqhtZvsteJhxCJE96dMAZSZ9y1PX.git", rev = "250f3b25d0933c2fa106aa82d1cc17a496716f06", optional = true }
cap-std = { version = "=4.0.2", optional = true }
cap-fs-ext = { version = "=4.0.2", optional = true }
crunch-wasm-component-core = { path = "../crunch-wasm-component-core" }
serde = { version = "1.0", default-features = false, features = ["alloc", "derive"] }
serde_json = { version = "1.0", default-features = false, features = ["alloc"] }

[dev-dependencies]
crunch-wasm-component = { path = "../crunch-wasm-component" }
