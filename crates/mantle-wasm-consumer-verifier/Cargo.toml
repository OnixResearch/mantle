[package]
name = "mantle-wasm-consumer-verifier"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Published consumer contract for verifying Mantle WebAssembly component materialization bundles"

[features]
default = ["std"]
std = ["blake3/std"]

[dependencies]
blake3 = { version = "=1.8.2", default-features = false }
crunch-wasm-component-core = { path = "../crunch-wasm-component-core" }
serde = { version = "1.0", default-features = false, features = ["alloc", "derive"] }
serde_json = { version = "1.0", default-features = false, features = ["alloc"] }
