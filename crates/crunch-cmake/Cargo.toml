[package]
name = "crunch-cmake"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "mantle-cmake"
path = "src/main.rs"

[dependencies]
crunch-cmake-core = { path = "../crunch-cmake-core" }
serde = { version = "1.0", features = ["derive"] }
