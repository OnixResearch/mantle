[package]
name = "crunch-store"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
async-trait = "0.1"
ed25519-dalek = "2.1.1"
nix-compat = { path = "../../vendor/nix-compat", features = ["serde"] }
snix-castore = { path = "../../vendor/snix-castore" }
snix-store = { path = "../../vendor/snix-store" }
blake3 = "=1.8.2"
data-encoding = "2.6"
futures = "0.3"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"
tokio = { version = "1", features = ["fs", "rt"] }
tracing = "0.1"
url = "2"

[dev-dependencies]
futures = "0.3"
pretty_assertions = "1.0"
tempfile = "3"
tokio = { version = "1", features = ["full"] }

