[package]
name = "crunch-rust-cache"
version.workspace = true
edition.workspace = true
license.workspace = true

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ["cfg(kani)"] }

[dependencies]
async-trait = "0.1"
blake3 = "=1.8.2"
crunch-rust-cache-core = { path = "../crunch-rust-cache-core" }
crunch-store = { path = "../crunch-store" }
data-encoding = "2.6"
ed25519-dalek = "2.2"
fs2 = "0.4"
libc = "0.2"
reqwest = { version = "0.13.1", default-features = true, features = ["stream"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
snix-castore = { path = "../../vendor/snix-castore" }
snix-store = { path = "../../vendor/snix-store" }
tempfile = "3"
thiserror = "2.0"
tokio = { version = "1", features = ["fs", "io-util", "rt", "time"] }
tokio-util = { version = "0.7", features = ["io"] }
url = "2"

[dev-dependencies]
crunch-action-result-core = { path = "../crunch-action-result-core" }
nix-compat = { path = "../../vendor/nix-compat", features = ["serde"] }
pretty_assertions = "1.0"
