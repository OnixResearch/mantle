[package]
name = "crunch-delta"
version.workspace = true
edition.workspace = true
license.workspace = true

[features]
experimental-vectorcdc = ["snix-castore/experimental-vectorcdc"]

[[example]]
name = "vectorcdc_candidate_compare"
required-features = ["experimental-vectorcdc"]

[dependencies]
async-trait = "0.1"
blake3 = "=1.8.2"
bytes = "1"
crunch-delta-core = { path = "../crunch-delta-core" }
crunch-store = { path = "../crunch-store" }
ed25519-dalek = "2.1.1"
futures = "0.3"
nix-compat = { path = "../../vendor/nix-compat", features = ["serde"] }
snix-castore = { path = "../../vendor/snix-castore" }
snix-store = { path = "../../vendor/snix-store" }
thiserror = "2.0"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "io-util", "fs"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
zstd = "0.13"
