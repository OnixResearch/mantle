[package]
name = "crunch-build"
version.workspace = true
edition.workspace = true
license.workspace = true

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ["cfg(kani)"] }

[dependencies]
artifact-auth-core = { git = "ssh://git@github.com/OnixResearch/onix-artifact.git", rev = "c932138d880ddf4c2967f4c024b489b5c0022bf1", version = "0.1.0" }
artifact-auth-ed25519 = { git = "ssh://git@github.com/OnixResearch/onix-artifact.git", rev = "c932138d880ddf4c2967f4c024b489b5c0022bf1", version = "0.1.0" }
async-trait = "0.1"
crunch-action-result-core = { path = "../crunch-action-result-core" }
mantle-causal-trace-core = { path = "../mantle-causal-trace-core" }
crunch-remote-core = { path = "../crunch-remote-core", features = ["serde"] }
crunch-attestation = { path = "../crunch-attestation" }
crunch-store = { path = "../crunch-store" }
nix-compat = { path = "../../vendor/nix-compat", features = ["serde"] }
snix-build = { path = "../../vendor/snix-build" }
snix-castore = { path = "../../vendor/snix-castore" }
snix-store = { path = "../../vendor/snix-store" }
blake3 = "=1.8.2"
bstr = "1.10"
digest = "=0.10.7"
md-5 = "0.10.6"
sha1 = "0.10.6"
sha2 = "0.10.8"
bytes = "1.7"
data-encoding = "2.6"
ed25519-dalek = "2.1.1"
gethostname = "0.5"
rand = "0.8"
futures = "0.3"
fs2 = "0.4"
libc = "0.2"
thiserror = "2.0"
tokio = { version = "1", features = ["fs", "process", "rt"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tracing = "0.1"
ureq = { version = "3.0", default-features = false, features = ["rustls"] }
flate2 = { version = "1", default-features = false, features = ["rust_backend"] }
tar = "0.4"
lzma-rs = "0.3"
bzip2-rs = "0.1"
ruzstd = "0.8"
tempfile = "3"
url = "2"
gix = { version = "0.81.0", features = ["blocking-http-transport-reqwest-rust-tls"] }

[dev-dependencies]
crunch-attestation = { path = "../crunch-attestation" }
crunch-glue = { path = "../crunch-glue" }
crunch-store = { path = "../crunch-store", features = ["test-support"] }
pretty_assertions = "1.0"
proptest = "1.11"
tempfile = "3"
tokio = { version = "1", features = ["full"] }
zstd = "0.13"
