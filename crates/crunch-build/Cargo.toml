[package]
name = "crunch-build"
version.workspace = true
edition.workspace = true
license.workspace = true

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ["cfg(kani)"] }

[dependencies]
artifact-auth-core = { git = "https://git.onix.computer/z4JGYYW7WsesXUq7MXVdx16Fawu2f.git", rev = "799459346d5416fbd7b9f55840a7371441b55afa", version = "0.1.0" }
artifact-auth-ed25519 = { git = "https://git.onix.computer/z4JGYYW7WsesXUq7MXVdx16Fawu2f.git", rev = "799459346d5416fbd7b9f55840a7371441b55afa", version = "0.1.0" }
async-trait = "0.1"
crunch-action-result-core = { path = "../crunch-action-result-core" }
crunch-attestation = { path = "../crunch-attestation" }
crunch-store = { path = "../crunch-store" }
nix-compat = { path = "../../vendor/nix-compat", features = ["serde"] }
snix-build = { path = "../../vendor/snix-build" }
snix-castore = { path = "../../vendor/snix-castore" }
snix-store = { path = "../../vendor/snix-store" }
blake3 = "=1.8.2"
bstr = "1.10"
digest = "=0.10.7"
md-5 = "0.10.6"
sha1 = "0.10.6"
sha2 = "0.10.8"
bytes = "1.7"
data-encoding = "2.6"
ed25519-dalek = "2.1.1"
gethostname = "0.5"
rand = "0.8"
futures = "0.3"
fs2 = "0.4"
libc = "0.2"
thiserror = "2.0"
tokio = { version = "1", features = ["fs", "process", "rt"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tracing = "0.1"
ureq = { version = "3.0", default-features = false, features = ["rustls"] }
flate2 = { version = "1", default-features = false, features = ["rust_backend"] }
tar = "0.4"
lzma-rs = "0.3"
bzip2-rs = "0.1"
ruzstd = "0.8"
tempfile = "3"
url = "2"
gix = { version = "0.81.0", features = ["blocking-http-transport-reqwest-rust-tls"] }

[dev-dependencies]
crunch-attestation = { path = "../crunch-attestation" }
crunch-glue = { path = "../crunch-glue" }
pretty_assertions = "1.0"
proptest = "1.11"
tempfile = "3"
tokio = { version = "1", features = ["full"] }
zstd = "0.13"
