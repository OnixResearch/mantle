[package]
name = "crunch-build"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
crunch-glue = { path = "../crunch-glue" }
nix-compat = { path = "../../vendor/nix-compat", features = ["serde"] }
snix-build = { path = "../../vendor/snix-build" }
snix-castore = { path = "../../vendor/snix-castore" }
snix-store = { path = "../../vendor/snix-store" }
blake3 = "=1.8.2"
bstr = "1.10"
bytes = "1.7"
data-encoding = "2.6"
futures = "0.3"
thiserror = "2.0"
tokio = { version = "1", features = ["fs", "process", "rt"] }
tracing = "0.1"

[dev-dependencies]
pretty_assertions = "1.0"
tempfile = "3"
tokio = { version = "1", features = ["full"] }
