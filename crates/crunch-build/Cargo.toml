[package]
name = "crunch-build"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
crunch-glue = { path = "../crunch-glue" }
crunch-store = { path = "../crunch-store" }
nix-compat = { path = "../../vendor/nix-compat", features = ["serde"] }
snix-build = { path = "../../vendor/snix-build" }
snix-castore = { path = "../../vendor/snix-castore" }
snix-store = { path = "../../vendor/snix-store" }
blake3 = "=1.8.2"
bstr = "1.10"
digest = "=0.10.7"
md-5 = "0.10.6"
sha1 = "0.10.6"
sha2 = "0.10.8"
bytes = "1.7"
data-encoding = "2.6"
futures = "0.3"
thiserror = "2.0"
tokio = { version = "1", features = ["fs", "process", "rt"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tracing = "0.1"
ureq = { version = "3.0", default-features = false, features = ["rustls"] }
flate2 = { version = "1", default-features = false, features = ["rust_backend"] }
tar = "0.4"
lzma-rs = "0.3"
bzip2-rs = "0.1"
ruzstd = "0.8"
url = "2"

[dev-dependencies]
pretty_assertions = "1.0"
tempfile = "3"
tokio = { version = "1", features = ["full"] }
tonic = "0.13.1"
zstd = "0.13"
