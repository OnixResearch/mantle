[package]
name = "crunch-release-core"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
artifact-auth-core = { git = "ssh://git@github.com/OnixResearch/onix-artifact.git", rev = "5f3962d7471d1547e044f57daeda72f56621fd52", default-features = false, features = ["serde"] }
artifact-auth-ed25519 = { git = "ssh://git@github.com/OnixResearch/onix-artifact.git", rev = "5f3962d7471d1547e044f57daeda72f56621fd52", default-features = false }
blake3 = { version = "=1.8.5", default-features = false }
bounded-tree-core = { git = "https://seed.radicle.garden/zqhtZvsteJhxCJE96dMAZSZ9y1PX.git", rev = "cc9e0fb611e75bb2d7f662435d1918653c93ce07" }
crunch-source-core = { path = "../crunch-source-core" }
serde = { version = "1.0", default-features = false, features = ["alloc", "derive"] }
serde_json = { version = "1.0", default-features = false, features = ["alloc"] }

[dev-dependencies]
ed25519-dalek = "2.1.1"
pretty_assertions = "1.0"
valence-core = { git = "ssh://git@github.com/OnixResearch/valence.git", rev = "15e72b5a330b08139ac7c809ac31e7e87f825b22" }
