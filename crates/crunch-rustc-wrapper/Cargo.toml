[package]
name = "crunch-rustc-wrapper"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
blake3 = "1.8"
crunch-rust-cache = { path = "../crunch-rust-cache" }
crunch-rust-cache-core = { path = "../crunch-rust-cache-core" }
crunch-store = { path = "../crunch-store" }
data-encoding = "2"
ed25519-dalek = "2"
libc = "0.2"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tempfile = "3"

[dev-dependencies]

[[bin]]
name = "mantle-rustc-wrapper"
path = "src/bin/mantle-rustc-wrapper.rs"

[[bin]]
name = "mantle-rust-cache-daemon"
path = "src/bin/mantle-rust-cache-daemon.rs"

[[bin]]
name = "mantle-rustc-manifest"
path = "src/bin/mantle-rustc-manifest.rs"
