[package]
name = "nix-compat"
version = "0.1.0"
edition = "2024"

[features]
async = ["tokio"]
hashbrown = ["dep:hashbrown"]
wire = ["tokio", "pin-project-lite", "bytes"]
flakeref = ["url"]
daemon = ["tokio", "nix-compat-derive", "futures"]
serde = ["dep:serde", "dep:serde_json", "dep:serde_with"]
test = []
default = ["async", "daemon", "hashbrown", "wire", "nix-compat-derive"]

[dependencies]
bitflags = "2.6.0"
blake3 = "1.5.4"
bstr = { version = "1.10.0", features = ["alloc", "unicode", "serde"] }
data-encoding = "2.6.0"
ed25519 = "2.2.3"
ed25519-dalek = "2.1.1"
futures = { version = "0.3.30", optional = true }
hashbrown = { version = "0.15.4", optional = true }
mimalloc = "0.1.43"
nom = "8.0"
serde = { version = "1.0.209", features = ["derive"], optional = true }
serde_json = { version = "1.0", optional = true }
serde_with = { version = "3.9.0", default-features = false, features = ["macros"], optional = true }
sha2 = "0.10.8"
thiserror = "2.0"
tracing = "0.1.40"
bytes = { version = "1.7.1", optional = true }
tokio = { version = "1.39.3", features = [
  "io-util",
  "macros",
  "sync",
], optional = true }
pin-project-lite = { version = "0.2.14", optional = true }
num_enum = "0.7.3"
url = { version = "2.5.2", optional = true }

[dependencies.nix-compat-derive]
path = "../nix-compat-derive"
optional = true

[dev-dependencies]
criterion = { version = "0.5", features = ["html_reports"] }
futures = "0.3.30"
hex-literal = "0.4.1"
mimalloc = "0.1.43"
mockall = "0.13.1"
pretty_assertions = { version = "1.4.0", features = ["unstable"] }
proptest = { version = "1.5.0", features = ["std", "alloc", "tempfile"] }
rstest = { version = "0.26.1", default-features = false }
smol_str = "0.2.2"
tokio-test = "0.4.4"
zstd = "0.13.2"

[[bench]]
name = "derivation_parse_aterm"
harness = false

[[bench]]
name = "narinfo_parse"
harness = false
