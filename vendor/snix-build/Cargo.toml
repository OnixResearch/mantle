[package]
name = "snix-build"
version = "0.1.0"
edition = "2024"

[dependencies]
bytes = { version = "1.7.1", features = ["serde"] }
async-trait = "0.1"
clap = { version = "4.5.16", features = ["derive", "env"] }
irpc = { version = "0.13", default-features = false, features = ["derive"] }
itertools = "0.12.1"
postcard = { version = "1", features = ["use-std"] }
serde = { version = "1", features = ["derive"] }
serde_bytes = "0.11"
thiserror = "2.0"
tokio = { version = "1.39.3", features = ["process"] }
snix-castore = { path = "../snix-castore", features = ["fuse"] }
tracing = "0.1.40"
url = "2.5.2"
mimalloc = "0.1.43"

anyhow = "1.0.79"
blake3 = "1.5.0"
bstr = "1.6.0"
data-encoding = "2.5.0"
futures = "0.3.30"
oci-spec = "0.7.0"
nix = { version = "0.29.0", features = ["user"] }
serde_json = "1.0"
uuid = { version = "1.7.0", features = ["v4"] }
typed-builder = "0.22.0"

[build-dependencies]

[features]
default = []

[dev-dependencies]
rstest = { version = "0.26.1", default-features = false }
tempfile = "3.3.0"
