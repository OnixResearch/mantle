name: flake-check

on:
  push:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  flake-check:
    runs-on: ubuntu-latest
    env:
      SLEEPINESS: '0'
    steps:
      - name: Check out Mantle
        uses: actions/checkout@v4
      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@v17
      - name: Verify operator catalogs and generated documentation
        run: nix develop --command ./scripts/check-operator-command-contract.sh
      - name: Verify the flake
        run: nix flake check
