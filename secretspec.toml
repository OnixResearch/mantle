[project]
name = "mantle"
revision = "1.0"
require_reason = false

[profiles.production]
TICKET_VERIFIER_KEY = { description = "Versioned keyed-BLAKE3 verifier key as <key-id>:<base64url-32-bytes>", required = true }
RESULT_SIGNING_KEY = { description = "Nix-format Ed25519 result-signing keypair", required = true }

[profiles.bootstrap]
TICKET_VERIFIER_KEY = { description = "Versioned keyed-BLAKE3 verifier key as <key-id>:<base64url-32-bytes>", required = true }
RESULT_SIGNING_KEY = { description = "Nix-format Ed25519 result-signing keypair", required = true }

[profiles.rotation]
TICKET_VERIFIER_KEY = { description = "Versioned keyed-BLAKE3 verifier key as <key-id>:<base64url-32-bytes>", required = true }
RESULT_SIGNING_KEY = { description = "Nix-format Ed25519 result-signing keypair", required = true }

[scopes.mantle-remote]
secrets = ["TICKET_VERIFIER_KEY", "RESULT_SIGNING_KEY"]
