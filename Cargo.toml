[workspace]
resolver = "2"
members = [
  "crates/crunch-eval",
  "crates/crunch-glue",
  "crates/crunch-build",
  "vendor/nix-compat",
  "vendor/nix-compat-derive",
  "vendor/snix-build",
  "vendor/snix-castore",
  "vendor/snix-store",
  "vendor/snix-tracing",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "AGPL-3.0-or-later"

[package]
name = "crunch"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "crunch"
path = "src/main.rs"

[dependencies]
crunch-eval = { path = "crates/crunch-eval" }
crunch-glue = { path = "crates/crunch-glue" }
crunch-build = { path = "crates/crunch-build" }
nix-compat = { path = "vendor/nix-compat" }
snix-build = { path = "vendor/snix-build" }
snix-castore = { path = "vendor/snix-castore" }
snix-store = { path = "vendor/snix-store" }
tokio = { version = "1", features = ["full"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
clap = { version = "4", features = ["derive", "env"] }

[dev-dependencies]
pretty_assertions = "1.0"
tempfile = "3"
