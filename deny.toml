[graph]
targets = []
all-features = false
no-default-features = false

[output]
feature-depth = 1

[advisories]
ignore = [
  { id = "RUSTSEC-2024-0436", reason = "paste comes through crunch-eval -> nickel-lang-core 0.16.1; remove when Nickel releases a paste-free core or Mantle carries that upstream migration" },
  { id = "RUSTSEC-2026-0173", reason = "proc-macro-error2 comes through vendor/snix-build -> oci-spec 0.7.1 -> getset 0.1.6; latest checked oci-spec 0.10.0 still uses getset, so remove when oci-spec/getset no longer pulls proc-macro-error2" },
  { id = "RUSTSEC-2026-0194", reason = "quick-xml comes through vendor/snix-castore -> object_store 0.14.0 -> quick-xml 0.40.1; remove when object_store permits quick-xml >=0.41" },
  { id = "RUSTSEC-2026-0195", reason = "quick-xml comes through vendor/snix-castore -> object_store 0.14.0 -> quick-xml 0.40.1; remove when object_store permits quick-xml >=0.41" },
]

[licenses]
allow = [
  "0BSD",
  "AGPL-3.0-or-later",
  "Apache-2.0",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "CC0-1.0",
  "CDLA-Permissive-2.0",
  "ISC",
  "LGPL-3.0-only",
  "MIT",
  "MIT-0",
  "MPL-2.0",
  "OpenSSL",
  "Unicode-3.0",
  "Unicode-DFS-2016",
  "Unlicense",
  "Zlib",
  "bzip2-1.0.6",
]
confidence-threshold = 0.8
exceptions = []

[licenses.private]
ignore = true
registries = []

[bans]
multiple-versions = "warn"
wildcards = "allow"
highlight = "all"
workspace-default-features = "allow"
external-default-features = "allow"
allow = []
deny = []
skip = []
skip-tree = []

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = ["https://github.com/tvlfyi/wu-manber.git"]
