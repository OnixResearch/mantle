[licenses]
allow = [
  "0BSD",
  "AGPL-3.0-or-later",
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "CC0-1.0",
  "CDLA-Permissive-2.0",
  # The vendored Snix data layer keeps its upstream GPL-3.0 terms (ADR 0162).
  "GPL-3.0-only",
  "ISC",
  "LGPL-3.0-only",
  "MIT",
  "MIT-0",
  "MPL-2.0",
  "OpenSSL",
  "Unicode-3.0",
  "Unicode-DFS-2016",
  "Unlicense",
  "Zlib",
  "bzip2-1.0.6",
]
confidence-threshold = 0.8
exceptions = []

[licenses.private]
# Evaluate every workspace member, including `publish = false` crates. The
# vendored Snix data layer declares its upstream GPL-3.0-only terms instead of
# inheriting the workspace expression (ADR 0162).
ignore = false
registries = []

[bans]
multiple-versions = "warn"
wildcards = "allow"
highlight = "all"
workspace-default-features = "allow"
external-default-features = "allow"
allow = []
deny = []
skip = []
skip-tree = []

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = [
  "https://github.com/OnixResearch/nickel-export",
  "https://github.com/tvlfyi/wu-manber.git",
  "https://github.com/cachix/casita",
  "https://github.com/cachix/turso.git",
  "https://github.com/OnixResearch/onix-artifact.git",
  # Immutable Mantle authority and evidence SDK revisions remain manifest/lock-bound.
  "https://github.com/OnixResearch/basalt.git",
  "https://github.com/OnixResearch/valence.git",
  "https://seed.radicle.garden/zqhtZvsteJhxCJE96dMAZSZ9y1PX.git",
  "https://git.onix.computer/z3tAR4For7qw8ZirkJzoDw1VNDDLM.git",
  "https://seed.radicle.garden/z4Tky6zvC8w4Y6c4YBzNxVbq5n752.git",
