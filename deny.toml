[graph]
targets = []
all-features = false
no-default-features = false

[output]
feature-depth = 1

[advisories]
ignore = [
  { id = "RUSTSEC-2023-0089", reason = "atomic-polyfill comes through heapless/postcard; current fix path is upstream-blocked until that stack moves to portable-atomic" },
  { id = "RUSTSEC-2024-0436", reason = "paste comes through nickel-lang-core; current fix path is upstream-blocked until Nickel drops or replaces paste" },
  { id = "RUSTSEC-2026-0173", reason = "proc-macro-error2 comes through oci-spec -> getset; latest oci-spec still depends on getset, so migration is upstream-blocked" },
  { id = "RUSTSEC-2026-0194", reason = "quick-xml comes through object_store; latest object_store still caps quick-xml below the fixed 0.41 line" },
  { id = "RUSTSEC-2026-0195", reason = "quick-xml comes through object_store; latest object_store still caps quick-xml below the fixed 0.41 line" },
]

[licenses]
allow = [
  "0BSD",
  "AGPL-3.0-or-later",
  "Apache-2.0",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "CC0-1.0",
  "CDLA-Permissive-2.0",
  "ISC",
  "LGPL-3.0-only",
  "MIT",
  "MIT-0",
  "MPL-2.0",
  "OpenSSL",
  "Unicode-3.0",
  "Unicode-DFS-2016",
  "Unlicense",
  "Zlib",
  "bzip2-1.0.6",
]
confidence-threshold = 0.8
exceptions = []

[licenses.private]
ignore = true
registries = []

[bans]
multiple-versions = "warn"
wildcards = "allow"
highlight = "all"
workspace-default-features = "allow"
external-default-features = "allow"
allow = []
deny = []
skip = []
skip-tree = []

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = ["https://github.com/tvlfyi/wu-manber.git"]
