[package]
name = "mantle-contract-hash-current-fixture"
version = "0.0.0"
edition = "2024"
publish = false
license = "AGPL-3.0-or-later"

[workspace]
resolver = "3"

[lib]
path = "../consumer.rs"

[dependencies]
mantle-build-contract = { path = "../../../../crates/mantle-build-contract", default-features = false }
blake3 = { version = "=1.8.7", default-features = false, features = ["pure"] }

[dev-dependencies]
serde = { version = "=1.0.228", features = ["derive"] }
serde_json = "=1.0.145"

[lints.rust]
unsafe_code = "forbid"
