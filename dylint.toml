# Repo-local tigerstyle config.
#
# Keep this file consumer-owned. Tigerstyle defaults stay in the lint crate;
# crunch chooses which findings block the build here.
#
# Current legacy policy: every Tiger Style lint is enabled and treated as an error.
# Current Octet policy denies only the reviewed nominal-domain family.
# The remote core scope enables targeted deterministic-profile diagnostics.

[octet]
nominal_domain_mode = "deny"
core_source_scopes = [
  "crates/crunch-remote-core/src/",
  "crates/crunch-resource-policy-core/src/",
  "crates/crunch-dev-resume-core/src/",
]

[tigerstyle]

[tigerstyle.lint_levels]
compound_assertion = "deny"
ignored_result = "deny"
no_unwrap = "deny"
no_panic = "deny"
no_todo = "deny"
unjustified_no_todo_allow = "deny"
no_recursion = "deny"
unchecked_narrowing = "deny"
unchecked_division = "deny"
unbounded_loop = "deny"
catch_all_on_enum = "deny"
explicit_defaults = "deny"
unbounded_channel = "deny"
unbounded_collection_growth = "deny"
assertion_density = "deny"
raw_arithmetic_overflow = "deny"
sentinel_fallback = "deny"
acronym_style = "deny"
bool_naming = "deny"
negated_predicate = "deny"
numeric_units = "deny"
float_for_currency = "deny"
function_length = "deny"
nested_conditionals = "deny"
platform_dependent_cast = "deny"
usize_in_public_api = "deny"
too_many_parameters = "deny"
compound_condition = "deny"
unjustified_allow = "deny"
ambiguous_params = "deny"
ambient_clock = "deny"
verified_purity = "deny"
contradictory_time = "deny"
multi_lock_ordering = "deny"
